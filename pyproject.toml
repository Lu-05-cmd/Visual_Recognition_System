[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-system"
version = "0.1.0"
description = "Industrial computer vision system for product detection, color recognition, tracking, and inspection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "opencv-python-headless>=4.10,<5.0",
  "numpy>=2.0,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]
neural = [
  "torch>=2.2,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visual_system = ["dashboard.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
